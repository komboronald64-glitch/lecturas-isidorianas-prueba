name: Preparar y publicar Lecturas Isidorianas

on:
  push:
    branches: [main]
    paths:
      - 'Lecturas_Isidorianas_app_sola.zip'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer la aplicación
        run: |
          test -f Lecturas_Isidorianas_app_sola.zip
          unzip -q Lecturas_Isidorianas_app_sola.zip
          test -f app/index.html
          test -f app/app.js
          test -f app/sw.js
          rm Lecturas_Isidorianas_app_sola.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app Lecturas_Isidorianas_app_sola.zip
          git commit -m "Añadir aplicación Lecturas Isidorianas"
          git push origin HEAD:main

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar archivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
